<body>

<script>
const NS = 'http://www.w3.org/2000/svg';
const S = document.getElementById('s');
const C = {
  chain:'#d97706', led:'#9333ea', enc:'#16a34a', analog:'#db2777', spi:'#2563eb',
  lcdcs:'#7c3aed', i2c:'#0891b2', eth:'#0d9488', usb:'#64748b', power:'#dc2626', audio:'#4f46e5'
};
const NAMES = {
  chain:'74HC165 掃描鏈 (G40/41/42)', led:'SK6812 燈鏈 (G48)', enc:'旋鈕 / Jog (直連)', analog:'T-Bar 類比 (G1)',
  spi:'SPI2 共享 (G11/12 + G47 DC)', lcdcs:'LCD CS / RES (MCP 輸出)', i2c:'I2C (G8/G9)',
  eth:'W5500 網口 (G10/13/14)', usb:'USB-C 直連 (G19/20)', audio:'I2S 音訊 (G2/21/38/39)', power:'電源 / 地'
};

function e(t, a = {}, txt) {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  S.appendChild(n); return n;
}
function T(x, y, txt, o = {}) {
  const a = { x, y, 'font-size': o.s || 12, 'font-weight': o.b ? 700 : 400, fill: o.c || '#1e293b', 'text-anchor': o.a || 'start' };
  if (o.net) { a['data-net'] = o.net; a.class = 'lb'; }
  return e('text', a, txt);
}
function box(x, y, w, h, title, lines, col, fs = 11.5) {
  e('rect', { x, y, width: w, height: h, rx: 8, fill: col + '18', stroke: col, 'stroke-width': 1.6 });
  T(x + 10, y + 19, title, { b: 1, s: 13, c: col });
  lines.forEach((l, i) => T(x + 10, y + 37 + i * (fs + 4.5), l, { s: fs, c: '#334155' }));
}
function W(pts, net, o = {}) {
  const d = 'M' + pts.map(p => p.join(' ')).join(' L ');
  e('path', { d, class: 'w', 'data-net': net, stroke: C[net], 'stroke-width': o.w || 2.4, fill: 'none',
    'stroke-dasharray': o.dash || '', 'stroke-linejoin': 'round',
    'marker-end': o.arrow ? (net === 'audio' ? 'url(#arA)' : 'url(#ar)') : '' });
  if (o.lab) T(o.lab[0], o.lab[1], o.lab[2], { s: 11, c: C[net], a: o.lab[3] || 'middle', net });
}
function J(x, y, net) { e('circle', { cx: x, cy: y, r: 4, fill: C[net], class: 'w', 'data-net': net }); }
function tag(x, y, w, txt, net) {
  e('rect', { x, y, width: w, height: 18, rx: 4, fill: '#fff', stroke: C[net], 'stroke-width': 1.3, class: 'w', 'data-net': net });
  T(x + w / 2, y + 13, txt, { a: 'middle', s: 9.5, c: C[net], net });
}

/* ================= ESP32-S3 本體 ================= */
const EX = 1130, EW = 340;
e('rect', { x: EX, y: 110, width: EW, height: 690, rx: 12, fill: '#e0f2fe', stroke: '#0369a1', 'stroke-width': 2.5 });
T(EX + EW / 2, 134, 'ESP32-S3-DevKitC-1', { a: 'middle', b: 1, s: 16, c: '#0369a1' });
T(EX + EW / 2, 152, '(N16R8 · 雙 Type-C)', { a: 'middle', s: 11, c: '#0369a1' });
const L = [ // 左側腳位
  [150,'G1 · ADC1_CH0','analog'],[184,'G4 · Jog A','enc'],[218,'G5 · Jog B','enc'],
  [252,'G6 · E1-A','enc'],[286,'G7 · E1-B','enc'],[320,'G15 · E2-A','enc'],[354,'G16 · E2-B','enc'],
  [388,'G17 · E3-A','enc'],[422,'G18 · E3-B','enc'],
  [456,'G40 · CLK','chain'],[490,'G41 · SH/LD','chain'],[524,'G48 · LED DIN','led'],[558,'G42 · QH 讀入','chain']
];
L.forEach(([y, t, n]) => { e('circle', { cx: EX, cy: y, r: 5, fill: C[n] }); T(EX + 12, y + 4, t, { s: 11.5, b: 1 }); });
const R = [ // 右側腳位
  [150,'G11 · MOSI','spi'],[184,'G12 · SCLK','spi'],[218,'G47 · LCD DC','spi'],
  [252,'G10 · W5500 CS','eth'],[286,'G13 · MISO','eth'],[320,'G14 · INT','eth'],
  [388,'G8 · SDA','i2c'],[422,'G9 · SCL','i2c'],[456,'G20 · USB D+','usb'],[490,'G19 · USB D-','usb']
];
R.forEach(([y, t, n]) => { e('circle', { cx: EX + EW, cy: y, r: 5, fill: C[n] }); T(EX + EW - 12, y + 4, t, { s: 11.5, b: 1, a: 'end' }); });
const B = [[1180,'G2','BCLK'],[1245,'G21','LRCK'],[1310,'G38','DOUT'],[1375,'G39','DIN']]; // 底側：I2S
B.forEach(([x, g, f]) => { e('circle', { cx: x, cy: 800, r: 5, fill: C.audio }); T(x, 772, g, { a: 'middle', s: 11, b: 1 }); T(x, 786, f, { a: 'middle', s: 10.5 }); });
['3V3 (J1-1/2) → 74HC165×15 · W5500 · MCP×2 · WM8960 數位 · T-Bar · 上拉',
 '5V (J1-21) ← 外部 5V PSU',
 'GND 全部星形單點共地',
 '禁用：G0 G3 G35–37 G45 G46（勿接外設）· G43/44 = UART0 除錯口保留'].forEach((s, i) => T(EX + EW / 2, 690 + i * 17, s, { a: 'middle', s: 10, c: '#0c4a6e' }));

/* ================= 左側：類比 / 旋鈕 ================= */
box(80, 120, 400, 48, 'T-Bar 推桿 B10K（ALPS RS6011）', ['1=GND · 2=Wiper→G1 · 3=3V3 · G1 對 GND 並 100nF'], C.analog);
W([[480, 150], [EX, 150]], 'analog', { lab: [805, 144, 'G1 ← Wiper（ADC1_CH0）'] });

box(80, 176, 400, 62, 'Jog 滾盤 LPD3806-100BM（KEY 90）', ['5V / GND 供電 · A、B 相（NPN 開漏）各 4.7kΩ 上拉到 3V3', '嚴禁上拉到 5V → 接 G4 / G5（PCNT0）'], C.enc);
W([[480, 184], [EX, 184]], 'enc', { lab: [805, 178, 'G4 ← A 相'] });
W([[480, 218], [EX, 218]], 'enc', { lab: [805, 212, 'G5 ← B 相'] });

const ENC = [
  ['EC11 #1 · E1 主音量 (KEY 80)', 'C→GND · S2→U11.A', 252, 286, 242, 'G6 ← A相 (PCNT1)', 'G7 ← B相'],
  ['EC11 #2 · E2 主持麥 (KEY 81)', 'C→GND · S2→U11.B', 320, 354, 308, 'G15 ← A相 (PCNT2)', 'G16 ← B相'],
  ['EC11 #3 · E3 來賓麥 (KEY 82)', 'C→GND · S2→U11.C', 388, 422, 376, 'G17 ← A相 (PCNT3)', 'G18 ← B相']
];
ENC.forEach(([t, l, ya, yb, by, la, lb]) => {
  box(80, by, 400, 58, t, [l], C.enc);
  W([[480, ya], [EX, ya]], 'enc', { lab: [805, ya - 6, la] });
  W([[480, yb], [EX, yb]], 'enc', { lab: [805, yb - 6, lb] });
});

/* 74HC165 控制線 → 下方鏈（15 片） */
W([[EX, 456], [44, 456], [44, 790], [1062, 790]], 'chain', { lab: [800, 450, 'G40 → CLK（U1–U15 Pin 2 並聯）'] });
W([[EX, 490], [30, 490], [30, 812], [1078, 812]], 'chain', { lab: [800, 484, 'G41 → SH/LD（U1–U15 Pin 1 並聯）'] });

/* LED 鏈 */
box(80, 502, 400, 80, 'SK6812 MINI-E × 80（LED #0 – #79）', ['G48 → 串 330Ω → #0 DIN → … → #79（DOUT→DIN 串接）', '5V 由電源區供電 · 燈鏈首端並 470µF/10V', '補電點：#0、#35、#79（20AWG）'], C.led);
W([[480, 524], [EX, 524]], 'led', { lab: [805, 518, 'G48 → 330Ω → DIN（RMT）'] });

/* E4：改由掃描鏈解碼 */
box(80, 596, 400, 62, 'EC11 #4 · E4 VTR 音 (KEY 83) — 已搬到掃描鏈', ['C→GND · S2→U11.D · A→U14.H · B→U15.A', '（2 kHz 掃描解碼，不再佔用 G38 / G39）'], C.enc);

/* G42 QH 回讀 */
W([[EX, 558], [1122, 558], [1122, 895], [1106, 895]], 'chain');
T(1118, 760, 'U15 QH → G42', { a: 'end', s: 11, c: C.chain, net: 'chain' });

/* ================= 74HC165 菊花鏈（15 片） ================= */
e('rect', { x: 8, y: 740, width: 1106, height: 270, rx: 10, fill: 'none', stroke: C.chain, 'stroke-dasharray': '6 5', 'stroke-width': 1.5 });
T(70, 764, '74HC165 × 15 菊花鏈（15×8 = 120 bit · 2 kHz 掃描 · 先移出的是 U15 的 H 腳）', { b: 1, s: 13, c: C.chain });
const CL = ['K0–7','K8–15','K16–23','K24–31','K32–39','K40–47','K48–55','K56–63','K64–71','K72–79','S2 ×8','S2×2+AB×3','AB×3+ENC11','導覽×6+S2+E4A','E4B+空×7'];
for (let i = 0; i < 15; i++) {
  const x = 70 + 70 * i;
  e('rect', { x, y: 860, width: 56, height: 70, rx: 5, fill: '#fef3c7', stroke: C.chain, 'stroke-width': 1.6 });
  T(x + 28, 885, 'U' + (i + 1), { a: 'middle', b: 1, s: 14, c: '#92400e' });
  T(x + 28, 902, '74HC165', { a: 'middle', s: 9, c: '#92400e' });
  T(x + 28, 918, 'A–H 輸入', { a: 'middle', s: 9, c: '#92400e' });
  T(x + 26, 948, CL[i], { a: 'middle', s: 8.5, c: '#334155' });
  W([[x + 12, 790], [x + 12, 860]], 'chain', { w: 1.6 }); J(x + 12, 790, 'chain');
  W([[x + 28, 812], [x + 28, 860]], 'chain', { w: 1.6 }); J(x + 28, 812, 'chain');
  W([[x + 46, 930], [x + 46, 985]], 'power', { w: 1.6 }); J(x + 46, 985, 'power');
  if (i < 14) W([[x + 56, 895], [x + 70, 895]], 'chain', { w: 2.4, arrow: true });
}
W([[70, 895], [58, 895], [58, 985]], 'power', { w: 1.6 });
W([[54, 985], [1108, 985]], 'power', { w: 2 });
T(70, 1002, 'GND：/CE (Pin 15) 全接地 · U1 SER (Pin 10) 接地 · 每片 Pin 8 GND；每片 VCC (Pin 16) 接 3V3 並就近 100nF', { s: 10.5, c: C.power, net: 'power' });
T(70, 842, '資料串接：前級 QH (Pin 9) → 後級 SER (Pin 10)', { s: 11, c: C.chain, net: 'chain' });

/* ================= 右側：W5500 / MCP#1 / USB / LCD ================= */
const LX = 1900;
e('rect', { x: LX, y: 110, width: 640, height: 210, rx: 8, fill: C.spi + '12', stroke: C.spi, 'stroke-width': 1.6 });
T(LX + 10, 129, '15× 2.25″ ST7789P 76×284 彩屏（ZJY225S0800TG01）', { b: 1, s: 13, c: C.spi });
const LCDS = ['GPA0 · Pod1 DSK1','GPA1 · Pod2 DSK2','GPA2 · Pod3 USER1','GPA3 · Pod4 PGM1','GPA4 · Pod5 PGM2',
  'GPA5 · Pod6 PGM3','GPA6 · Pod7 PVW1','GPA7 · Pod8 PVW2','GPB0 · Pod9 PVW3','GPB1 · Pod10 USER2',
  'GPB2 · Pod11 TRANS1','GPB3 · Pod12 TRANS2','GPB4 · Pod13 REPLAY','GPB5 · PodA E1–6','GPB6 · PodB E7–10'];
LCDS.forEach((s, i) => {
  const x = LX + 12 + (i % 5) * 124, y = 142 + Math.floor(i / 5) * 50;
  e('rect', { x, y, width: 118, height: 44, rx: 5, fill: '#fff', stroke: C.lcdcs, 'stroke-width': 1.2 });
  T(x + 6, y + 17, 'LCD #' + (i + 1) + ' · CS' + (i + 1), { s: 11, b: 1, c: C.lcdcs });
  T(x + 6, y + 34, s, { s: 9.5, c: '#475569' });
});
T(LX + 10, 308, '共用：SDA←G11 · SCL←G12 · DC←G47 · RES←MCP#1 GPB7 · VCC/BLK←3.3V 降壓 · 每 2–3 片並 100nF', { s: 10.5, c: '#334155' });

W([[EX + EW, 150], [LX, 150]], 'spi', { lab: [1700, 144, 'G11 MOSI（SDA）· 33Ω', 'start'] });
W([[EX + EW, 184], [LX, 184]], 'spi', { lab: [1700, 178, 'G12 SCLK（SCL）· 33Ω', 'start'] });
W([[EX + EW, 218], [LX, 218]], 'spi', { lab: [1700, 212, 'G47 DC（共用）', 'start'] });

box(1560, 236, 280, 112, 'W5500 乙太網模組', ['CS←G10 · MISO→G13 · INT→G14', 'RST ← MCP#2 GPA2（原 G21）', 'MOSI/SCLK 與 LCD 並聯（上方分支）', '3V3 / GND（需 ≥200mA）· RJ45 齊平後背板'], C.eth, 11);
W([[1620, 150], [1620, 236]], 'spi'); J(1620, 150, 'spi');
W([[1660, 184], [1660, 236]], 'spi'); J(1660, 184, 'spi');
T(1626, 232, 'MOSI', { s: 9.5, c: C.spi, net: 'spi' }); T(1666, 232, 'SCLK', { s: 9.5, c: C.spi, net: 'spi' });
[[252,'G10 CS'],[286,'G13 MISO'],[320,'G14 INT']].forEach(([y, t]) =>
  W([[EX + EW, y], [1560, y]], 'eth', { lab: [1515, y - 5, t] }));
tag(1700, 352, 130, 'NET: W5500_RST ← MCP#2', 'lcdcs');

box(1560, 378, 280, 62, 'MCP23017 #1（0x20 · 16/16 滿載）', ['A0–A2 接地 · RESET 10kΩ 上拉 · SDA/SCL 4.7kΩ 上拉'], C.i2c, 10.5);
W([[EX + EW, 388], [1560, 388]], 'i2c', { lab: [1515, 383, 'G8 SDA'] });
W([[EX + EW, 422], [1560, 422]], 'i2c', { lab: [1515, 417, 'G9 SCL'] });
W([[1840, 402], [1960, 402], [1960, 320]], 'lcdcs', { w: 4 });
T(1850, 396, 'CS1–CS15 ×15', { s: 11, c: C.lcdcs, net: 'lcdcs' });
T(1850, 414, 'GPA0–7 · GPB0–6', { s: 10, c: C.lcdcs, net: 'lcdcs' });
W([[1840, 426], [2010, 426], [2010, 320]], 'lcdcs', { w: 2.4 });
T(1850, 440, 'RES ← GPB7（共用）', { s: 11, c: C.lcdcs, net: 'lcdcs' });

box(1560, 448, 280, 62, 'USB-C（板載 · 優先權 1）', ['D+ ← G20 · D- ← G19 · 勿外接其他元件', 'TinyUSB NCM+CDC → 電腦 192.168.7.1:16622'], C.usb);
W([[EX + EW, 456], [1560, 456]], 'usb', { lab: [1515, 451, 'G20 D+'] });
W([[EX + EW, 490], [1560, 490]], 'usb', { lab: [1515, 485, 'G19 D-'] });

/* ================= 電源 ================= */
box(1560, 560, 240, 140, '外部電源 5V / 5–6A', ['DC 座 + 470µF', '20AWG 粗線供 LED', '與 ESP32 星形單點共地', '遠離 T-Bar (G1) 類比線'], C.power);
W([[1800, 630], [1850, 630]], 'power', { w: 3 });
W([[1850, 590], [1850, 729]], 'power', { w: 3 });
W([[1850, 590], [1900, 590]], 'power'); W([[1850, 653], [1900, 653]], 'power'); W([[1850, 729], [1900, 729]], 'power');
box(1900, 570, 400, 40, '→ ESP32-S3 5V 腳（J1-21）供電', [], C.power);
box(1900, 620, 400, 66, '→ SK6812 × 80 燈鏈 5V', ['#0 / #35 / #79 三點補電（見左側 LED 區）', '全亮峰值約 3.6–4.8 A'], C.power);
box(1900, 696, 400, 70, '→ MP1584 / MINI360 5V→3.3V / 2A', ['供 15×LCD + 4.0″ 大屏 + WM8960 + MCP×2（約 0.7 A）', '僅與 ESP32 共地，不從開發板 3V3 拉大電流'], C.power, 11);
W([[2300, 729], [2420, 729], [2420, 320]], 'power', { w: 3 });
T(2430, 520, '3.3V →', { s: 11, c: C.power, net: 'power' });
T(2430, 536, '15×LCD VCC/BLK', { s: 11, c: C.power, net: 'power' });

/* ================= v2：音訊 / 大螢幕 / 導覽鍵 ================= */
// I2S 線：ESP 底側 → WM8960
const IS = [[1180,'BCLK','G2 → BCLK'],[1245,'LRCK','G21 → LRCK (WS)'],[1310,'DACDAT','G38 → DACDAT'],[1375,'ADCDAT','ADCDAT → G39']];
IS.forEach(([x, f, t], i) => {
  W([[x, 800], [x, 1100]], 'audio', { w: 2.4 });
  T(x + 5, 1060 - (i % 2) * 14, t, { s: 10, c: C.audio, net: 'audio' });
});
// WM8960
box(1130, 1100, 340, 210, 'WM8960 立體聲編解碼模組', [
  'I2S 全雙工 · 48 kHz · PLL 取自 BCLK（不需 MCLK）',
  'I2C 位址 0x1A ← G8/G9 共線',
  'BCLK←G2 · LRCK←G21 · DACDAT←G38 · ADCDAT→G39',
  '輸入來源（MIC1/2/3）由暫存器切換，不佔 GPIO',
  '耳機輸出約 40 mW · 音量 = E5 旋鈕（軟體）',
  '數位 / 類比電源分別濾波，遠離 SK6812 5V 軌',
  '可用輸入→耳機混音器做低延遲自聽 (sidetone)'
], C.audio, 10.5);
tag(1180, 1318, 80, 'NET: G8 SDA', 'i2c'); tag(1270, 1318, 80, 'NET: G9 SCL', 'i2c');
W([[1220, 1318], [1220, 1310]], 'i2c', { dash: '3 3' }); W([[1310, 1318], [1310, 1310]], 'i2c', { dash: '3 3' });

// 麥克風 / 6.35mm / 耳機區塊（四合一全接口前端）
box(1560, 1068, 450, 50, 'MIC 1 · 3.5mm 麥克風孔（耳麥 / 領夾麥 Electret）', ['→ WM8960 LINPUT1 · 由內部 MICBIAS (~2.5V) 偏壓供電'], C.audio, 10.5);
box(1560, 1124, 450, 58, 'MIC 2 · XLR 專業平衡麥克風孔（★ 支援 OFF / +5V / +48V 三模）', [
  '5V→48V 升壓經 6.81kΩ×2 送 Pin2/3（MCP#2 GPA4 控 48V、GPA5 控 5V）',
  '經 22µF/63V 隔直電容 + INA217 平衡前級 → WM8960 LINPUT2'
], C.audio, 10);

/* ================= 圖例與互動 ================= */
const lg = document.getElementById('legend');
const active = new Set();
function refresh() {
  document.querySelectorAll('[data-net]').forEach(n => {
    if (!n.closest('svg')) return;
    n.classList.toggle('hide', active.size > 0 && !active.has(n.dataset.net));
  });
  lg.querySelectorAll('.chip').forEach(c => c.classList.toggle('off', active.size > 0 && !active.has(c.dataset.k)));
}
Object.keys(NAMES).forEach(k => {
  const c = document.createElement('span');
  c.className = 'chip'; c.dataset.k = k;
  c.style.borderColor = C[k]; c.style.color = C[k]; c.textContent = '● ' + NAMES[k];
  c.onclick = () => { active.has(k) ? active.delete(k) : active.add(k); refresh(); };
  lg.appendChild(c);
});
document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-z]').forEach(x => x.classList.remove('on')); b.classList.add('on');
  S.style.width = b.dataset.z + '%';
});
</script>
