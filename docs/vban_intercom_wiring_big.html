<script>
const NS = 'http://www.w3.org/2000/svg';
const S = document.getElementById('s');
const C = {
  eth:'#0d9488', spi3:'#2563eb', lcdcs:'#7c3aed', i2c:'#0891b2',
  audio:'#4f46e5', enc:'#16a34a', chain:'#d97706', led:'#9333ea', usb:'#64748b', power:'#dc2626'
};
const NAMES = {
  eth:'SPI2 專線 · W5500 網口 (G10–14/47)',
  spi3:'SPI3 專線 · 7 塊彩屏 (G1/G2/G42)',
  lcdcs:'LCD CS / RES (單顆 MCP 0x20)',
  i2c:'I2C 總線 (G8/G9)',
  audio:'I2S 全雙工 + 0ms 自聽 (G4/5/38/39)',
  enc:'3×EC11 硬體 PCNT (G6/7/15–18)',

  led:'36×SK6812 燈鏈 (VOX來電閃燈/Mute/同發)',
  usb:'USB-C 直連 (G19/20)',
  power:'電源 / PoE / 地'
};

function e(t, a = {}, txt) {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  S.appendChild(n); return n;
}
function T(x, y, txt, o = {}) {
  const a = { x, y, 'font-size': o.s || 12, 'font-weight': o.b ? 700 : 400, fill: o.c || '#1e293b', 'text-anchor': o.a || 'start' };
  if (o.net) { a['data-net'] = o.net; a.class = 'lb'; }
  return e('text', a, txt);
}
function box(x, y, w, h, title, lines, col, fs = 11.5) {
  e('rect', { x, y, width: w, height: h, rx: 8, fill: col + '16', stroke: col, 'stroke-width': 1.6 });
  T(x + 10, y + 19, title, { b: 1, s: 13, c: col });
  lines.forEach((l, i) => T(x + 10, y + 37 + i * (fs + 4.5), l, { s: fs, c: '#334155' }));
}
function W(pts, net, o = {}) {
  const d = 'M' + pts.map(p => p.join(' ')).join(' L ');
  e('path', { d, class: 'w', 'data-net': net, stroke: C[net], 'stroke-width': o.w || 2.4, fill: 'none',
    'stroke-dasharray': o.dash || '', 'stroke-linejoin': 'round',
    'marker-end': o.arrow ? (net === 'audio' ? 'url(#arA)' : 'url(#ar)') : '' });
  if (o.lab) T(o.lab[0], o.lab[1], o.lab[2], { s: 11, c: C[net], a: o.lab[3] || 'middle', net });
}
function J(x, y, net) { e('circle', { cx: x, cy: y, r: 4, fill: C[net], class: 'w', 'data-net': net }); }

T(EX + EW / 2, 152, '獨立 VBAN 路由拆分 & 36 鍵 Intercom 主站', { a: 'middle', s: 11.5, c: '#0369a1', b: 1 });

L.forEach(([y, t, n]) => { e('circle', { cx: EX, cy: y, r: 5, fill: C[n] }); T(EX + 12, y + 4, t, { s: 11.5, b: 1 }); });

R.forEach(([y, t, n]) => { e('circle', { cx: EX + EW, cy: y, r: 5, fill: C[n] }); T(EX + EW - 12, y + 4, t, { s: 11.5, b: 1, a: 'end' }); });

const B = [[1175,'G4','BCLK'],[1250,'G5','LRCK'],[1325,'G38','DOUT'],[1400,'G39','DIN']]; // 底側：I2S0

['★ 黃金雙 SPI：W5500 獨佔 SPI2 · 7 塊彩屏走獨立 SPI3 (刷音量表不卡音訊)',

 '禁用保留：G0 G3 G35–37 G45 G46 · UART0 (G43/44) 保留除錯'].forEach((s, i) => T(EX + EW / 2, 665 + i * 17, s, { a: 'middle', s: 10.2, c: '#0c4a6e' }));

/* ================= 左側：3 顆極簡旋鈕 (硬體 PCNT) + 36 顆 LED (含 VOX 閃燈說明) ================= */

  ['EC11 #3 · ENC3 Config 選單 / Mic PGA 增益調節', 'C→GND · 按壓 S2→U5.G（主畫面直接調 Mic 增益 dB；選單內做確認/鍵盤輸入）', 338, 371, 322, 'G17 ← A 相 (PCNT2)', 'G18 ← B 相']

box(70, 515, 430, 92, 'SK6812 MINI-E × 36 顆（LED #0 – #35 智慧語音 Tally 燈）', [

  '🟠 橘白快閃 = 對方有聲音進來 (VOX > -40dBFS 自動閃燈) · 🔴 紅爆閃 = 對方按 Call',
  '🟢 綠燈 = 正對他發話 · 🩵 青燈 = 已勾選「部分同發」 · 🟣 紫紅暗燈 = 已單獨 Mute 他',
  '峰值僅 1.6A（5V 頭尾 #0 / #35 兩點補電 + 470µF 電容）'
], C.led, 10.5);

const U6_INFO = [

  ['U2', 'K8–K15 (8鍵)', 'Pod 2 (K8–11) + Pod 3 (K12–15)'],

];
U6_INFO.forEach(([u, sub, desc], i) => {
  const x = 75 + i * 150;

  T(x + 60, 790, u + ' · 74HC165', { a: 'middle', b: 1, s: 13.5, c: '#92400e' });
  T(x + 60, 810, sub, { a: 'middle', b: 1, s: 10.5, c: '#b45309' });
  T(x + 60, 830, desc, { a: 'middle', s: 9, c: '#334155' });
  W([[x + 30, 700], [x + 30, 765]], 'chain', { w: 1.6 }); J(x + 30, 700, 'chain');
  W([[x + 60, 722], [x + 60, 765]], 'chain', { w: 1.6 }); J(x + 60, 722, 'chain');
  W([[x + 90, 845], [x + 90, 880]], 'power', { w: 1.6 }); J(x + 90, 880, 'power');
  if (i < 5) W([[x + 120, 805], [x + 150, 805]], 'chain', { w: 2.5, arrow: true });
});
W([[75, 805], [55, 805], [55, 880]], 'power', { w: 1.6 });
W([[50, 880], [990, 880]], 'power', { w: 2 });
T(60, 900, 'GND：每片 Pin 15 (/CE) 接地 · U1 Pin 10 (SER) 接地 · 每片配 1 條 A103J (10kΩ×8) 排阻上拉至 3V3 + 100nF 退耦', { s: 11, c: C.power, net: 'power' });

// 導覽鍵 + 三段式撥桿開關 + 腳踏 PTT 視覺化小方塊
['▲ U5.H','▼ U6.A','◀ U6.B','▶ U6.C','⏎ 進入 U6.D','⎋ 離開 U6.E','🕹️三段撥桿 U6.F/G','🦶腳踏PTT U6.H'].forEach((s, i) => {
  const x = 48 + i * 124;
  const isLever = i === 6;
  e('rect', { x, y: 922, width: 116, height: 44, rx: 7, fill: isLever ? '#fef08a' : '#fff', stroke: isLever ? '#ca8a04' : C.chain, 'stroke-width': isLever ? 2.2 : 1.5 });
  T(x + 58, 949, s, { a: 'middle', s: 11.2, b: 1, c: '#92400e' });
});
T(50, 988, '★ 🕹️ 三段式發話撥桿開關 (ON)-OFF-ON 接法：中間 COM 腳接 GND；上扳自鎖腳接 U6.F (=持續發話 Latch)；下壓彈回腳接 U6.G (=瞬時 PTT)；放回中間兩腳皆高電平 = 強制 MUTE！', { s: 10.8, b: 1, c: '#b45309' });
T(50, 1008, '★ 雙擊任意工位鍵（或按 K31 禁聽鍵+工位鍵）= 單獨 Mute 該工位來話；短按勾選多個工位（亮青燈）後壓撥桿 = 「可選部分同發」！', { s: 10.8, c: '#334155' });

/* ================= 右側上半：SPI2 獨佔 W5500 網口 ================= */
box(1560, 150, 430, 195, 'W5500 有線網口模組（★ 100% 獨佔 SPI2 總線）', [
  'CS←G10 · MOSI←G11 · SCLK←G12 · MISO→G13',

  '★ 建議加裝「5V PoE 分離器」：工位單插一條網線即可供電+通話',
  '備援：USB-C (G19/20 NCM) 與 2.4GHz Wi-Fi 三模無縫切換'
], C.eth, 11);
[[175,'G10 CS'],[205,'G11 MOSI'],[235,'G12 SCLK'],[265,'G13 MISO'],[295,'G14 INT'],[325,'G47 RST']].forEach(([y, t]) =>
  W([[EX + EW, y], [1560, y]], 'eth', { lab: [1515, y - 5, t] }));

box(1560, 480, 430, 118, '單顆 MCP23017-E/SP（0x20 · 管 7 塊屏 + 幻象電源與 6.35mm 模式）', [

/* ================= 圖例與互動 ================= */
const lg = document.getElementById('legend');
const active = new Set();
function refresh() {
  document.querySelectorAll('[data-net]').forEach(n => {
    if (!n.closest('svg')) return;
    n.classList.toggle('hide', active.size > 0 && !active.has(n.dataset.net));
  });
  lg.querySelectorAll('.chip').forEach(c => c.classList.toggle('off', active.size > 0 && !active.has(c.dataset.k)));
}
Object.keys(NAMES).forEach(k => {
  const c = document.createElement('span');
  c.className = 'chip'; c.dataset.k = k;
  c.style.borderColor = C[k]; c.style.color = C[k]; c.textContent = '● ' + NAMES[k];
  c.onclick = () => { active.has(k) ? active.delete(k) : active.add(k); refresh(); };
  lg.appendChild(c);
});
document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-z]').forEach(x => x.classList.remove('on')); b.classList.add('on');
  S.style.width = b.dataset.z + '%';
});
</script>
