; ============================================================================
; 專案 B：ESP32-S3 80 鍵 (13x[2x3]+2) + 11xEC11 + 15x2.25" + 4.0" 大屏 + VBAN 主導播切換台 v2
; 支援分階段硬體單項測試 (Stage 1~5) 與完整正式版 (full_switcher)
; 使用方法：
;   pio run -e stage1_hc165_15chips -t upload  (測試 15片74HC165 = 120 bits：80鍵+11旋鈕+6導覽鍵)
;   pio run -e stage2_tbar_jog_pcnt -t upload  (測試 T-Bar ADC 濾波 + Jog 手輪 + PCNT 旋鈕 E1–E3)
;   pio run -e stage3_sk6812_80leds -t upload  (測試 80顆 SK6812 Tally 燈鏈與三點補電壓降)
;   pio run -e stage4_dual_mcp_lcds -t upload  (測試 雙 MCP23017 (0x20/0x21) + 15小屏 + 4.0"大屏)
;   pio run -e stage5_net_companion -t upload  (測試 USB-NCM / W5500 / Wi-Fi 三模備援 + Companion TCP 16622)
;   pio run -e full_switcher        -t upload  (★ 燒錄完整版 80 鍵導播切換台 v2 韌體)
; ============================================================================

[platformio]
default_envs = full_switcher

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -I../shared_components
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0

[env:stage1_hc165_15chips]
build_src_filter = -<*> +<../tests/test_01_hc165_15chips.cpp>

[env:stage2_tbar_jog_pcnt]
build_src_filter = -<*> +<../tests/test_02_tbar_jog_pcnt.cpp>

[env:stage3_sk6812_80leds]
build_src_filter = -<*> +<../tests/test_03_sk6812_80leds.cpp>

[env:stage4_dual_mcp_lcds]
build_src_filter = -<*> +<../tests/test_04_dual_mcp_16lcds.cpp>

[env:stage5_net_companion]
build_src_filter = -<*> +<../tests/test_05_net_companion.cpp>

[env:full_switcher]
build_src_filter = -<*> +<main_switcher_full.cpp>
