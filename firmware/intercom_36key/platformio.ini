; ============================================================================
; 專案 A：ESP32-S3 獨立 36 鍵 (6x[2x3]) VBAN 路由拆分 & Intercom 主站
; 支援分階段硬體單項測試 (Stage 1~5) 與完整正式版 (full_production)
; 使用方法：
;   pio run -e stage1_hc165_lever -t upload   (測試 6片74HC165 + 36鍵 + 三段發話撥桿)
;   pio run -e stage2_pcnt_enc    -t upload   (測試 3顆硬體 PCNT 旋鈕 E1/E2/ENC3)
;   pio run -e stage3_sk6812_vox  -t upload   (測試 36顆 SK6812 燈珠與 VOX 橘白閃燈)
;   pio run -e stage4_spi3_lcds   -t upload   (測試 MCP23017 + SPI3 7塊彩屏與虛擬鍵盤)
;   pio run -e stage5_wm8960_audio -t upload  (測試 WM8960 0ms自聽 + 1W喇叭防嘯叫 + XLR 5V/48V)
;   pio run -e full_intercom      -t upload   (★ 燒錄完整版 36 鍵 VBAN Intercom 主站韌體)
; ============================================================================

[platformio]
default_envs = full_intercom

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -I../shared_components
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0

[env:stage1_hc165_lever]
build_src_filter = -<*> +<../tests/test_01_hc165_and_lever.cpp>

[env:stage2_pcnt_enc]
build_src_filter = -<*> +<../tests/test_02_pcnt_encoders.cpp>

[env:stage3_sk6812_vox]
build_src_filter = -<*> +<../tests/test_03_sk6812_vox_sim.cpp>

[env:stage4_spi3_lcds]
build_src_filter = -<*> +<../tests/test_04_dual_spi_lcds.cpp>

[env:stage5_wm8960_audio]
build_src_filter = -<*> +<../tests/test_05_wm8960_sidetone.cpp>

[env:full_intercom]
build_src_filter = -<*> +<main_intercom_full.cpp>
